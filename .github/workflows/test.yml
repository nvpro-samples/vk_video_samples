name: CI
run-name: CI by ${{ github.actor }}

on:
  workflow_dispatch:

  # Runs on pushes to the default branch and on pull requests targeting it.
  # A topic branch is gated through its pull request, so nothing beyond the
  # default branch is enumerated here.
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8 pytest

      - name: Run flake8
        run: |
          python -m flake8 tests/*.py tests/*/*.py --max-line-length=100 --show-source --statistics

      - name: Run pylint
        run: |
          python -m pylint tests/*.py tests/*/*.py --output-format=text

  unit-tests:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-24.04

    env:
      BUILD_JOBS: 16

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install --assume-yes --no-install-recommends \
            ninja-build \
            cmake \
            ffmpeg \
            libx11-dev \
            libwayland-dev \
            libavformat-dev \
            libxrandr-dev \
            libvulkan-dev

      - name: Build release
        run: |
          cmake -B BUILD -DCMAKE_BUILD_TYPE=Release
          cmake --build BUILD --parallel $BUILD_JOBS --config Release

      # The C++ suite. This is the only `ctest` invocation under
      # .github/workflows/, so it is what makes the tree's add_test()
      # registrations gate anything.
      #
      # This runner (ubuntu-24.04, GitHub-hosted) has NO NVIDIA GPU, so the
      # tests are split by label: the device-free set must be green here and
      # is the real gate, and the gpu set reports SKIPPED rather than FAILED
      # when there is no device -- so it is green here too, and becomes a
      # genuine gate the day this job moves to a GPU runner. The script also
      # fails if any registered test carries neither label, and fails if a
      # label selects zero tests, so the gate cannot quietly become a no-op.
      - name: Run CTest suite
        run: |
          ./scripts/run_ctest_ci.sh BUILD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          pytest tests/unit_tests/ -v

      # Content for the negative cells is generated, not downloaded: it is derived
      # from the public YUVs the suite already fetches. Building it here is cheap and
      # lets those cells run instead of being skipped for absent content. The script
      # gates every artifact it writes (exact byte count, ffprobe profile/pix_fmt, and
      # a peak sample above the 10-bit range for the 12-bit input), so a wrong-format
      # result fails here rather than becoming a test that passes for the wrong
      # reason.
      - name: Generate negative-cell test content
        run: |
          OUT=tests/resources/video/negative bash ./scripts/gen_negative_test_content.sh

      - name: Run codec test framework
        run: |
          python3 ./tests/vvs_test_runner.py
