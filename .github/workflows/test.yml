name: CI
run-name: CI by ${{ github.actor }}

on:
  workflow_dispatch:

  # Runs on pushes to the default branch and on pull requests targeting it.
  # A topic branch is gated through its pull request, so nothing beyond the
  # default branch is enumerated here.
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      # The whole history: the format check compares the change with its merge base.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # clang-format is pinned: another version formats some lines differently.
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8 pytest clang-format==15.0.7

      - name: Run flake8
        run: |
          python -m flake8 tests/*.py tests/*/*.py --max-line-length=100 --show-source --statistics

      - name: Run pylint
        run: |
          python -m pylint tests/*.py tests/*/*.py --output-format=text

      # The C and C++ lines a change adds or edits follow .clang-format, and a new file does whole;
      # a file that is not clang-format clean keeps its own style (scripts/check_code_format.sh). A
      # pull request is compared with its target branch, a push with the commit before it.
      - name: Check the C and C++ formatting
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            base="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE"
          else
            base="origin/main"
          fi
          ./scripts/check_code_format.sh "$base"

  # The encoder's DPB library, vkvideo-dpb (common/libs/VkVideoDpb), as C only: ISO C99 with gcc and
  # clang, warnings as errors, also under the sanitizers, and with MSVC compiling it as C (/TC). The
  # other jobs build it beside the C++ tree, where a C++-only construct in its headers or sources would
  # pass unseen. scripts/check_dpb_library_c.sh fetches the Vulkan-Headers tag the build pins.
  dpb-library-c:
    name: DPB library as C (${{ matrix.compiler }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            os: ubuntu-24.04
          - compiler: clang
            os: ubuntu-24.04
          - compiler: msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and test as C99
        if: matrix.compiler != 'msvc'
        env:
          CC: ${{ matrix.compiler }}
        run: |
          ./scripts/check_dpb_library_c.sh BUILD_DPB_C
          SANITIZE=1 VULKAN_HEADERS_DIR=$(ls -d "$PWD"/BUILD_DPB_C/Vulkan-Headers-*) \
            ./scripts/check_dpb_library_c.sh BUILD_DPB_C_SANITIZE

      # MSVC has no C99 switch: /TC compiles the sources as C, /std:c11 to the C standard the library's
      # C99 is a subset of.
      - name: Build and test as C with MSVC
        if: matrix.compiler == 'msvc'
        shell: pwsh
        run: |
          $tag = (Select-String -Path cmake/FindVulkanAndDependencies.cmake -Pattern '^\s*GIT_TAG (v[0-9.]+)$' |
                  Select-Object -First 1).Matches[0].Groups[1].Value
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch $tag https://github.com/KhronosGroup/Vulkan-Headers.git BUILD_DPB_C/Vulkan-Headers
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
                  -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $sources = (Get-ChildItem common/libs/VkVideoDpb/src/*.c).FullName + (Resolve-Path common/libs/VkVideoDpb/tests/vvs_dpb_test.c).Path
          $cl = "cl /nologo /TC /std:c11 /W4 /WX /Icommon/libs/VkVideoDpb/include /IBUILD_DPB_C/Vulkan-Headers/include " +
                "/FoBUILD_DPB_C/ /FeBUILD_DPB_C/vkvideo-dpb-test-c.exe " + ($sources -join ' ')
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && $cl"
          if ($LASTEXITCODE -ne 0) { throw "MSVC build failed" }
          ./BUILD_DPB_C/vkvideo-dpb-test-c.exe
          if ($LASTEXITCODE -ne 0) { throw "vkvideo-dpb-test failed" }

  unit-tests:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-24.04

    env:
      BUILD_JOBS: 16

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install --assume-yes --no-install-recommends \
            ninja-build \
            cmake \
            ffmpeg \
            libx11-dev \
            libwayland-dev \
            libavformat-dev \
            libxrandr-dev \
            libvulkan-dev

      - name: Build release
        run: |
          cmake -B BUILD -DCMAKE_BUILD_TYPE=Release
          cmake --build BUILD --parallel $BUILD_JOBS --config Release

      # The C++ suite. This is the only `ctest` invocation under
      # .github/workflows/, so it is what makes the tree's add_test()
      # registrations gate anything.
      #
      # This runner (ubuntu-24.04, GitHub-hosted) has NO NVIDIA GPU, so the
      # tests are split by label: the device-free set must be green here and
      # is the real gate, and the gpu set reports SKIPPED rather than FAILED
      # when there is no device -- so it is green here too, and becomes a
      # genuine gate the day this job moves to a GPU runner. The script also
      # fails if any registered test carries neither label, and fails if a
      # label selects zero tests, so the gate cannot quietly become a no-op.
      - name: Run CTest suite
        run: |
          ./scripts/run_ctest_ci.sh BUILD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          pytest tests/unit_tests/ -v

      # Content for the negative cells is generated, not downloaded: it is derived
      # from the public YUVs the suite already fetches. Building it here is cheap and
      # lets those cells run instead of being skipped for absent content. The script
      # gates every artifact it writes (exact byte count, ffprobe profile/pix_fmt, and
      # a peak sample above the 10-bit range for the 12-bit input), so a wrong-format
      # result fails here rather than becoming a test that passes for the wrong
      # reason.
      - name: Generate negative-cell test content
        run: |
          OUT=tests/resources/video/negative bash ./scripts/gen_negative_test_content.sh

      # This runner has no Vulkan Video device, so every cell is not supported
      # and nothing can pass: the step proves that the framework runs, builds
      # its commands and classifies the results. A run in which nothing passed
      # fails unless --allow-no-pass says so; on a GPU runner, drop it.
      - name: Run codec test framework
        run: |
          python3 ./tests/vvs_test_runner.py --allow-no-pass

  sanitizers:
    name: Sanitizers
    needs: lint
    runs-on: ubuntu-24.04

    env:
      BUILD_JOBS: 16

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install --assume-yes --no-install-recommends \
            ninja-build \
            cmake \
            ffmpeg \
            libx11-dev \
            libwayland-dev \
            libavformat-dev \
            libxrandr-dev \
            libvulkan-dev

      # Every sanitizer report is fatal, so a test passes only when AddressSanitizer
      # and UBSan report nothing. UBSan's bounds check sees the overflows that stay
      # inside one object, where AddressSanitizer sees nothing.
      - name: Build with AddressSanitizer and UBSan
        run: |
          SAN="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          cmake -B BUILD-SAN -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="$SAN" -DCMAKE_CXX_FLAGS="$SAN" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build BUILD-SAN --parallel $BUILD_JOBS

      # The device-free set, the parser fuzz replay included. The script lists the
      # tests a known defect fails, each with its defect: those must still fail, and
      # every other test must pass.
      - name: Run the device-free tests under the sanitizers
        run: |
          ./scripts/run_ctest_sanitizers.sh BUILD-SAN
